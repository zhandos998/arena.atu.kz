x-app-environment: &app-environment
  APP_NAME: ${APP_NAME:-ATU Code Arena}
  APP_ENV: production
  APP_KEY: ${APP_KEY:?APP_KEY must be set in docker.env}
  APP_DEBUG: "false"
  APP_URL: ${APP_URL:-https://arena.atu.kz}
  APP_LOCALE: ${APP_LOCALE:-ru}
  APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-en}
  LOG_CHANNEL: stderr
  LOG_LEVEL: ${LOG_LEVEL:-warning}
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: 3306
  DB_DATABASE: ${DOCKER_DB_DATABASE:?DOCKER_DB_DATABASE must be set in docker.env}
  DB_USERNAME: ${DOCKER_DB_USERNAME:?DOCKER_DB_USERNAME must be set in docker.env}
  DB_PASSWORD: ${DOCKER_DB_PASSWORD:?DOCKER_DB_PASSWORD must be set in docker.env}
  SESSION_DRIVER: database
  CACHE_STORE: database
  QUEUE_CONNECTION: database
  DB_QUEUE_RETRY_AFTER: 950
  JUDGE_WORKSPACE_PATH: /var/www/html/storage/app/judge
  JUDGE_DOCKER_WORKSPACE_PATH: ${JUDGE_DOCKER_WORKSPACE_PATH:-/opt/apps/arena/storage/app/judge}

x-app-service: &app-service
  build:
    context: .
    target: app
  image: atu-arena-app:latest
  restart: unless-stopped
  environment: *app-environment
  volumes:
    - type: volume
      source: app_storage
      target: /var/www/html/storage
      volume:
        nocopy: true
  depends_on:
    db:
      condition: service_healthy

services:
  app:
    <<: *app-service

  queue:
    <<: *app-service
    command: php artisan queue:work database --queue=judge,default --sleep=1 --tries=2 --timeout=900
    stop_grace_period: 30s
    volumes:
      - type: volume
        source: app_storage
        target: /var/www/html/storage
        volume:
          nocopy: true
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ${DOCKER_PROJECT_PATH:-/opt/apps/arena}/storage/app/judge
        target: /var/www/html/storage/app/judge

  nginx:
    build:
      context: .
      target: nginx
    image: atu-arena-nginx:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DOCKER_HTTP_PORT:-8122}:80"
    volumes:
      - type: volume
        source: app_storage
        target: /var/www/html/storage
        read_only: true
        volume:
          nocopy: true
    depends_on:
      app:
        condition: service_started
      phpmyadmin:
        condition: service_started

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DOCKER_DB_DATABASE:?DOCKER_DB_DATABASE must be set in docker.env}
      MYSQL_USER: ${DOCKER_DB_USERNAME:?DOCKER_DB_USERNAME must be set in docker.env}
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:?DOCKER_DB_PASSWORD must be set in docker.env}
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:?DOCKER_DB_ROOT_PASSWORD must be set in docker.env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: ${PHPMYADMIN_URL:-https://arena.atu.kz/phpmyadmin/}
      UPLOAD_LIMIT: 128M
    ports:
      - "127.0.0.1:${DOCKER_PHPMYADMIN_PORT:-8123}:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  app_storage:
  mysql_data:
